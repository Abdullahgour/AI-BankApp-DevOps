services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
        MYSQL_ROOT_PASSWORD: Test@123
        MYSQL_DATABASE: bankappdb
    ports:
     - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
     - mysql-data:/var/lib/mysql
    networks:
     - bankapp-nw    
  bankapp:
    build: .
    image: ${DOCKERHUB_USER}/bankapp:${DOCKER_TAG}
    container_name: bankapp
    ports:
      - "80:8080"
    environment:
       MYSQL_HOST: mysql
       MYSQL_PORT: 3306
       MYSQL_DATABASE: bankappdb
       MYSQL_USER: root 
       MYSQL_PASSWORD: Test@123
    depends_on:
       mysql:
        condition: service_healthy
    networks:
      - bankapp-nw
